[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pypathmap"
version = "0.1.0"
description = "Visualize Python package dependency trees from filesystem or source code"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
authors = [
    {name = "Felix Hartmann", email = "292670385+felixhartmannnn@users.noreply.github.com"}
]
keywords = [
    "python",
    "dependency",
    "visualization",
    "tree",
    "tooling",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
]
dependencies = []

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-cov",
    "ruff>=0.4.0",
]

[project.scripts]
pypathmap = "pypathmap.cli:main"

[project.urls]
Homepage = "https://github.com/felixhartmannnn/pypathmap"
Repository = "https://github.com/felixhartmannnn/pypathmap"
"Bug Tracker" = "https://github.com/felixhartmannnn/pypathmap/issues"

[tool.setuptools.packages.find]
where = ["src"]
namespaces = false

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v"

[tool.ruff]
line-length = 88
target-version = "py39"

[tool.coverage.run]
source = ["pypathmap"]
omit = ["*/tests/*"]
